spring.application.name=auth-service
server.port=8081

# Base de datos H2 en archivo (persistente entre reinicios). Consola: http://localhost:8081/h2-console
spring.datasource.url=jdbc:h2:file:./data/authdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Secreto para firmar los tokens (solo uso academico)
panalsuite.auth.token-secret=cambiar-este-secreto-academico-panalsuite-2026
panalsuite.auth.token-ttl-hours=12
